# Dev overlay: load the plugin by absolute source path without installing.
# On Windows the loader imports via ESM, so local paths must be file:// URLs.
- insert:
    - id: theme-plugin
      name: 'file:///E:/DSH/dsh-theme-plugin/index.js'
      config:
        preset: custom
        light:
          accent: '#DA7756'
          background: '#F5F3EE'
          foreground: '#1D1B16'
          uiFont: '"Source Han Serif SC", serif'
          codeFont: '"SF Mono", Consolas, monospace'
          translucentSidebar: off
          contrast: 60
        dark:
          accent: '#CC7D5E'
          background: '#2D2D2B'
          foreground: '#F9F9F7'
          uiFont: '-apple-system, sans-serif'
          codeFont: 'ui-monospace, monospace'
          translucentSidebar: on
          contrast: 60
